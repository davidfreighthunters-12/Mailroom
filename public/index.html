<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mailroom</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5f7;--panel:#fff;--ink:#17212b;--mute:#5d6b78;--line:#dbe2e8;--acc:#1c6e8c;--acc-ink:#fff;--warm:#e3a72f;--ok:#2f8f5b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--panel:#1a222b;--ink:#e8eef3;--mute:#93a1ae;--line:#2b3641;--acc:#4fb0d0;--acc-ink:#0b1a22;--warm:#f0bd4f;--ok:#57c48a}}
:root[data-theme="dark"]{--bg:#12171d;--panel:#1a222b;--ink:#e8eef3;--mute:#93a1ae;--line:#2b3641;--acc:#4fb0d0;--acc-ink:#0b1a22;--warm:#f0bd4f;--ok:#57c48a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh}
.logo{font-weight:700;font-size:20px;letter-spacing:-.02em;padding:0 8px 18px}
.logo b{color:var(--acc)}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mute);font:inherit;font-weight:500;padding:9px 10px;border-radius:6px;cursor:pointer}
nav button:hover{background:var(--bg)}nav button.on{background:var(--bg);color:var(--ink);box-shadow:inset 3px 0 0 var(--acc)}
main{padding:28px 32px;max-width:1100px;width:100%}
h1{font-size:26px;letter-spacing:-.02em;margin:0 0 4px}h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 22px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g2{grid-template-columns:1fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.stat b{display:block;font-size:28px;letter-spacing:-.02em}.stat span{color:var(--mute);font-size:13px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--mute);font-weight:500}
.scroll{overflow-x:auto}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
textarea{min-height:190px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:13px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:6px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:4px 10px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:130px}.row>.btn{flex:none}
.tag{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:0 9px;font-size:12px}
.pill{border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600}.pill.sent{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}.pill.draft{background:color-mix(in srgb,var(--warm) 22%,transparent);color:var(--ink)}
.prev{background:#fff;color:#222;border:1px solid var(--line);border-radius:8px;padding:0;overflow:hidden;font-family:Georgia,serif}
.prev .hd{background:#f5f5f5;color:#555;font:12px system-ui;padding:8px 14px;border-bottom:1px solid #e3e3e3}
.prev .bd{padding:18px 22px;line-height:1.6}.prev h3{margin:0 0 8px}.prev a.cta{display:inline-block;background:#1c6e8c;color:#fff;padding:9px 16px;border-radius:5px;text-decoration:none;font-family:system-ui}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:500;display:none;z-index:9}
.empty{color:var(--mute);padding:18px 0;text-align:center}
@media(max-width:760px){.app{grid-template-columns:1fr}nav{position:static;height:auto;display:flex;gap:4px;overflow-x:auto;padding:10px;border-right:0;border-bottom:1px solid var(--line)}nav .logo{padding:8px 10px}nav button{width:auto;white-space:nowrap}nav button.on{box-shadow:inset 0 -3px 0 var(--acc)}main{padding:20px 16px}.g2{grid-template-columns:1fr}}
.tb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.swr{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}.sw:hover{transform:scale(1.15)}.swr input[type=color]{width:34px;height:28px;padding:0;border:0;background:none}
</style>
</head>
<body>
<div class="app">
<nav id="nav"><div class="logo">Mail<b>room</b></div></nav>
<main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script>
const KEY='mailroom:v1';
const seed={subs:[
{e:'amina@example.com',n:'Amina',t:'customers'},{e:'bilal@example.com',n:'Bilal',t:'leads'},
{e:'sara@example.com',n:'Sara',t:'customers'},{e:'omar@example.com',n:'Omar',t:'leads'}],
camps:[{id:1,name:'Welcome series #1',subject:'Welcome aboard, {{name}}',seg:'all',status:'sent',sent:4,opens:3,clicks:1,date:'2026-09-20'}]};
let S;try{S=JSON.parse(localStorage.getItem(KEY))||seed}catch(e){S=seed}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2200)}
const TPL={
blank:{subject:'',text:''},
newsletter:{subject:"This month's update",text:'Hi {{name}},\n\nHere is what we shipped this month and what is coming next.\n\n[Read the full update](https://example.com)'},
promo:{subject:'{{name}}, 20% off until Friday',text:'A little thank-you, {{name}}.\n\nUse code **THANKS20** at checkout for 20% off your next order.\n\n[Shop now](https://example.com)'},
welcome:{subject:'Welcome aboard, {{name}}',text:'Welcome, {{name}}!\n\nThanks for signing up. Here is how to get started in three minutes.\n\n[Start here](https://example.com)'}};
const FONTS={Arial:'Arial,Helvetica,sans-serif',Georgia:'Georgia,serif',Verdana:'Verdana,Geneva,sans-serif',Tahoma:'Tahoma,Geneva,sans-serif','Trebuchet MS':'Trebuchet MS,Helvetica,sans-serif','Times New Roman':'Times New Roman,Times,serif','Courier New':'Courier New,monospace'};
const PAL=['#17212b','#111111','#ffffff','#f2f5f7','#fdf6e3','#1c6e8c','#2f8f5b','#c0392b','#8e44ad','#e3a72f','#e67e22','#2c3e50'];
const newDraft=()=>({name:'',subject:'',seg:'all',text:'',font:'Arial',size:'16',color:'#17212b',link:'#1c6e8c',bg:'#ffffff',btn:false});
let draft=newDraft(),mob=false;
function buildHtml(d){
const L=d.btn?`display:inline-block;background:${d.link};color:#fff;padding:10px 18px;border-radius:6px;text-decoration:none;font-weight:600`:`color:${d.link};text-decoration:underline`;
const b=esc(d.text.replace(/\r/g,'')).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,`<a href="$2" style="${L}">$1</a>`);
const ps=b.split(/\n{2,}/).map(p=>p.trim()).filter(Boolean).map(p=>`<p style="margin:0 0 16px">${p.replace(/\n/g,'<br>')}</p>`).join('');
return `<div style="background:${d.bg};padding:24px"><div style="max-width:600px;margin:0 auto;font-family:${FONTS[d.font]};font-size:${d.size}px;line-height:1.6;color:${d.color}">${ps}</div></div>`}
let view='dash';
const tabs=[['dash','Overview'],['camps','Campaigns'],['comp','New campaign'],['aud','Audience']];
$('nav').insertAdjacentHTML('beforeend',tabs.map(([k,l])=>`<button data-k="${k}">${l}</button>`).join(''));
$('nav').onclick=e=>{const k=e.target.dataset.k;if(k){view=k;render()}};
const segs=()=>['all',...new Set(S.subs.map(s=>s.t))];
const segCount=s=>s==='all'?S.subs.length:S.subs.filter(x=>x.t===s).length;
const merge=(t,s)=>t.replace(/{{\s*name\s*}}/g,s?s.n:'there').replace(/{{\s*company\s*}}/g,'Your Company');
const pct=(a,b)=>a&&b?Math.round(a/b*100)+'%':'–';
function dash(){
const sent=S.camps.filter(c=>c.status==='sent'),tot=sent.reduce((a,c)=>a+c.sent,0),op=sent.reduce((a,c)=>a+c.opens,0),cl=sent.reduce((a,c)=>a+c.clicks,0);
const max=Math.max(1,...sent.map(c=>c.sent));
const bars=sent.slice(-6).map((c,i)=>{const h=c.opens/max*90,x=20+i*70;return `<rect x="${x}" y="${110-h}" width="44" height="${h}" fill="var(--acc)" rx="3"/><text x="${x+22}" y="126" text-anchor="middle" font-size="10" fill="var(--mute)">${esc(c.name.slice(0,9))}</text>`}).join('');
return `<h1>Overview</h1><p class="sub">How your email is performing.</p>
<div class="grid g4"><div class="card stat"><b>${S.subs.length}</b><span>Subscribers</span></div><div class="card stat"><b>${sent.length}</b><span>Campaigns sent</span></div><div class="card stat"><b>${pct(op,tot)}</b><span>Open rate</span></div><div class="card stat"><b>${pct(cl,tot)}</b><span>Click rate</span></div></div>
<div class="card" style="margin-top:14px"><h2>Opens per campaign</h2>${sent.length?`<svg viewBox="0 0 460 132" width="100%" style="max-width:520px">${bars}</svg>`:'<div class="empty">Send your first campaign to see results.</div>'}</div>`}
function camps(){
return `<div class="row" style="align-items:center"><div><h1>Campaigns</h1><p class="sub">Drafts and sent emails.</p></div><button class="btn" data-a="new">New campaign</button></div>
<div class="card scroll">${S.camps.length?`<table><tr><th>Name</th><th>Audience</th><th>Status</th><th>Opens</th><th>Clicks</th><th></th></tr>${S.camps.slice().reverse().map(c=>`<tr><td><b>${esc(c.name)}</b><br><span style="color:var(--mute)">${esc(c.subject)}</span></td><td>${esc(c.seg)}</td><td><span class="pill ${c.status}">${c.status}</span></td><td>${c.status==='sent'?pct(c.opens,c.sent):'–'}</td><td>${c.status==='sent'?pct(c.clicks,c.sent):'–'}</td><td><button class="btn ghost sm" data-a="del" data-id="${c.id}">Delete</button></td></tr>`).join('')}</table>`:'<div class="empty">No campaigns yet. Create one to get started.</div>'}</div>`}
function sw(k,l){return `<label>${l}</label><div class="swr">${PAL.map(c=>`<button type="button" class="sw" data-a="col" data-k="${k}" data-v="${c}" style="background:${c}" title="${c}"></button>`).join('')}<input type="color" id="k-${k}" value="${draft[k]}" title="Pick any color"></div>`}
function comp(){
const d=draft;
return `<h1>New campaign</h1><p class="sub">Type plain text, add links with the Link button, and watch the preview.</p>
<div class="grid g2"><div class="card">
<label>Start from a template</label><select id="tpl"><option value="">Choose…</option><option value="blank">Blank (empty)</option><option value="newsletter">Newsletter</option><option value="promo">Promotion</option><option value="welcome">Welcome</option></select>
<label>Campaign name</label><input id="cn" value="${esc(d.name)}" placeholder="September newsletter">
<label>Subject line <span id="cc" style="float:right"></span></label><input id="cs" value="${esc(d.subject)}">
<label>Send to</label><select id="cg">${segs().map(s=>`<option value="${esc(s)}" ${s===d.seg?'selected':''}>${s==='all'?'Everyone':esc(s)} (${segCount(s)})</option>`).join('')}</select>
<label>Message (blank line = new paragraph)</label>
<div class="tb"><button type="button" class="btn ghost sm" data-a="bold">Bold</button><button type="button" class="btn ghost sm" data-a="link">Link</button><button type="button" class="btn ghost sm" data-a="nm">Insert name</button></div>
<textarea id="cb" placeholder="Hi {{name}},&#10;&#10;Write your message here.">${esc(d.text)}</textarea>
<h2 style="margin-top:18px">Style</h2>
<div class="row"><div><label>Font</label><select id="cf">${Object.keys(FONTS).map(f=>`<option ${f===d.font?'selected':''}>${f}</option>`).join('')}</select></div><div><label>Text size</label><select id="cz">${[14,16,18,20].map(z=>`<option ${String(z)===String(d.size)?'selected':''}>${z}</option>`).join('')}</select></div></div>
${sw('color','Text color')}${sw('link','Link color')}${sw('bg','Background color')}
<label style="display:flex;gap:8px;align-items:center;margin-top:14px"><input id="cbtn" type="checkbox" style="width:auto" ${d.btn?'checked':''}> Show links as buttons</label>
<div class="row" style="margin-top:14px"><button class="btn ghost" data-a="save">Save draft</button><button class="btn ghost" data-a="test">Send test</button><button class="btn" data-a="send">Send campaign</button></div>
</div><div><div class="row" style="align-items:center;margin-bottom:8px"><h2 style="margin:0">Preview</h2><div class="tb" style="margin:0;flex:none"><button type="button" class="btn ghost sm" data-a="dev" data-v="d">Desktop</button><button type="button" class="btn ghost sm" data-a="dev" data-v="m">Mobile</button></div></div><div class="prev" id="pv"></div></div></div>`}
function aud(){
return `<h1>Audience</h1><p class="sub">${S.subs.length} subscribers.</p>
<div class="card"><h2>Add subscribers</h2><div class="row"><div><label>Email</label><input id="ae" type="email" placeholder="name@example.com"></div><div><label>First name</label><input id="an"></div><div><label>Tag</label><input id="at" placeholder="customers"></div><button class="btn" data-a="add">Add</button></div>
<label>Upload any .csv file (needs an email column)</label><input id="afile" type="file" accept=".csv,.txt,text/csv,text/plain">
<label>Or paste a CSV (email,name,tag – one per line)</label><textarea id="acsv" style="min-height:70px" placeholder="jo@example.com,Jo,leads"></textarea><button class="btn ghost" style="margin-top:8px" data-a="csv">Import CSV</button></div>
<div class="card scroll" style="margin-top:14px">${S.subs.length?`<table><tr><th>Email</th><th>Name</th><th>Tag</th><th></th></tr>${S.subs.map((s,i)=>`<tr><td>${esc(s.e)}</td><td>${esc(s.n)}</td><td><span class="tag">${esc(s.t)}</span></td><td><button class="btn ghost sm" data-a="rm" data-id="${i}">Remove</button></td></tr>`).join('')}</table>`:'<div class="empty">No subscribers yet. Add one above.</div>'}</div>`}
function pv(){
const el=$('pv');if(!el)return;const s=S.subs.find(x=>draft.seg==='all'||x.t===draft.seg);
el.style.maxWidth=mob?'360px':'none';el.style.margin=mob?'0 auto':'0';
const cc=$('cc');if(cc)cc.textContent=draft.subject.length+' characters';
el.innerHTML=`<div class="hd"><b>Subject:</b> ${esc(merge(draft.subject,s)||'(no subject)')}<br>To: ${s?esc(s.e):'preview@example.com'}</div>${merge(buildHtml(draft),s&&{n:esc(s.n)})}`}
function render(){
[...$('nav').querySelectorAll('button')].forEach(b=>b.classList.toggle('on',b.dataset.k===view));
$('main').innerHTML={dash,camps,comp,aud}[view]();
if(view==='comp')pv();
}
function parseCsv(text){
text=text.replace(/^\uFEFF/,'');
const first=text.split(/\r?\n/)[0]||'';
const d=[',',';','\t','|'].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
const rows=[];let row=[],cur='',q=false;
for(let i=0;i<text.length;i++){const c=text[i];
if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
else if(c==='"')q=true;
else if(c===d){row.push(cur);cur=''}
else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}
else cur+=c}
row.push(cur);rows.push(row);
return rows.map(r=>r.map(x=>x.trim())).filter(r=>r.some(x=>x))}
function importCsv(text){
const re=/^\S+@\S+\.\S+$/,rows=parseCsv(text);
if(!rows.length)return toast('That file is empty');
let ei=-1,ni=-1,ti=-1,start=0;const h=rows[0];
if(!h.some(x=>re.test(x))){start=1;
ei=h.findIndex(x=>/e-?mail/i.test(x));
ni=h.findIndex(x=>/first/i.test(x));
if(ni<0)ni=h.findIndex(x=>/^(full\s*)?name$/i.test(x));
if(ni<0)ni=h.findIndex(x=>/name/i.test(x));
ti=h.findIndex(x=>/tag|group|segment|list|label|categor/i.test(x))}
let n=0,skip=0;
rows.slice(start).forEach(r=>{
let e=ei>-1&&re.test(r[ei]||'')?ei:r.findIndex(x=>re.test(x));
if(e<0){skip++;return}
const em=r[e].toLowerCase();
if(S.subs.some(s=>s.e.toLowerCase()===em)){skip++;return}
let nm=ni>-1?r[ni]:(start===0?r[e+1]:'');
let tg=ti>-1?r[ti]:(start===0?r[e+2]:'');
if(re.test(nm||''))nm='';if(re.test(tg||''))tg='';
S.subs.push({e:em,n:nm||'there',t:tg||'general'});n++});
save();render();toast(n+' imported'+(skip?', '+skip+' skipped (no valid email or already added)':''))}
function readDraft(){if(view!=='comp')return;const g=i=>$(i).value;draft.name=g('cn');draft.subject=g('cs');draft.seg=g('cg');draft.text=g('cb');draft.font=g('cf');draft.size=g('cz');draft.color=g('k-color');draft.link=g('k-link');draft.bg=g('k-bg');draft.btn=$('cbtn').checked}
$('main').addEventListener('input',e=>{if(view==='comp'&&e.target.id!=='tpl'){readDraft();pv()}});
$('main').addEventListener('change',async e=>{
if(e.target.id==='afile'){const f=e.target.files[0];if(!f)return;
try{importCsv(await f.text())}catch(err){toast('Could not read that file')}return}
if(e.target.id==='tpl'&&TPL[e.target.value]){readDraft();Object.assign(draft,TPL[e.target.value]);render()}else if(view==='comp'){readDraft();pv()}});
const nid=()=>Math.max(0,...S.camps.map(c=>c.id))+1;
let PW='';const getPw=()=>PW||(PW=prompt('Admin password')||'');
async function api(rec){const pw=getPw();if(!pw)return false;toast('Sending…');
try{const r=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json','x-admin-password':pw},body:JSON.stringify({subject:draft.subject,html:buildHtml(draft),recipients:rec})});
const j=await r.json();if(!r.ok){PW='';toast(j.error||'Send failed');return false}return true}
catch(err){toast('Could not reach the server');return false}}
$('main').addEventListener('click',async e=>{
const a=e.target.dataset.a;if(!a)return;const id=+e.target.dataset.id;
if(a==='new'){view='comp';render()}
if(a==='del'){S.camps=S.camps.filter(c=>c.id!==id);save();render()}
if(a==='rm'){S.subs.splice(id,1);save();render()}
if(a==='add'){const em=$('ae').value.trim();if(!/^\S+@\S+\.\S+$/.test(em))return toast('Enter a valid email address');
if(S.subs.some(s=>s.e===em))return toast('That email is already subscribed');
S.subs.push({e:em,n:$('an').value.trim()||'there',t:$('at').value.trim()||'general'});save();render();toast('Subscriber added')}
if(a==='csv')importCsv($('acsv').value);
if(['bold','link','nm'].includes(a)){const t=$('cb'),x=t.selectionStart,y=t.selectionEnd,sel=t.value.slice(x,y);let r;
if(a==='bold')r='**'+(sel||'bold text')+'**';
else if(a==='nm')r='{{name}}';
else{const u=(prompt('Link address, e.g. https://example.com','https://')||'').trim();if(!u)return;r='['+(prompt('Text to show for the link',sel||'Click here')||u)+']('+u+')'}
t.setRangeText(r,x,y,'end');t.focus();readDraft();pv();return}
if(a==='col'){const k=e.target.dataset.k;draft[k]=e.target.dataset.v;$('k-'+k).value=e.target.dataset.v;pv();return}
if(a==='dev'){mob=e.target.dataset.v==='m';pv();return}
if(a==='save'||a==='send'||a==='test'){readDraft();
if(a!=='save'&&(!draft.subject.trim()||!draft.text.trim()))return toast('Add a subject line and a message first');
if(a==='test'){const em=(prompt('Send a test to which email address?')||'').trim();if(!/^\S+@\S+\.\S+$/.test(em))return toast('Enter a valid email address');
if(await api([{email:em,name:'there'}]))toast('Test sent to '+em);return}
if(!draft.name.trim()||!draft.subject.trim())return toast('Add a campaign name and subject line');
const cnt=segCount(draft.seg);
if(a==='send'&&!cnt)return toast('This audience has no subscribers');
if(a==='send'&&!await api(S.subs.filter(s=>draft.seg==='all'||s.t===draft.seg).map(s=>({email:s.e,name:s.n}))))return;
const c={id:nid(),name:draft.name,subject:draft.subject,seg:draft.seg,status:a==='send'?'sent':'draft',sent:0,opens:0,clicks:0,date:new Date().toISOString().slice(0,10)};
if(a==='send'){c.sent=cnt}
